<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PipePipe</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>
  // apply theme before first paint
  try { const t = localStorage.getItem('pp.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="sidebar-toggle" title="메뉴 (Ctrl+B)" aria-label="메뉴"><svg><use href="#i-menu"/></svg></button>
      <a class="brand" href="#/" aria-label="PipePipe 홈">
        <img src="icon.svg" alt="" width="26" height="26">
        <span>PipePipe</span>
      </a>
    </div>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <div class="service-pick">
        <button type="button" id="service-btn" class="service-btn" title="서비스 선택"><span id="service-name">YouTube</span><svg><use href="#i-chevron"/></svg></button>
        <div class="menu" id="service-menu" hidden></div>
      </div>
      <div class="search-field">
        <svg class="search-ico"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="검색 또는 URL 붙여넣기" spellcheck="false" aria-label="검색">
        <kbd class="kbd">/</kbd>
        <ul class="suggest" id="suggest" hidden></ul>
      </div>
    </form>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" title="테마 전환" aria-label="테마 전환"><svg><use href="#i-moon"/></svg></button>
      <a class="icon-btn" href="#/settings" title="설정" aria-label="설정"><svg><use href="#i-settings"/></svg></a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="탐색">
    <a class="nav-item" href="#/" data-route="home"><svg><use href="#i-flame"/></svg><span>탐색</span></a>
    <a class="nav-item" href="#/feed" data-route="feed"><svg><use href="#i-rss"/></svg><span>구독</span></a>
    <a class="nav-item" href="#/history" data-route="history"><svg><use href="#i-history"/></svg><span>시청 기록</span></a>
    <a class="nav-item" href="#/library" data-route="library"><svg><use href="#i-library"/></svg><span>보관함</span></a>
    <div class="nav-sep"></div>
    <div class="nav-title"><span>구독 채널</span><a href="#/subs" title="구독 관리">관리</a></div>
    <div class="nav-subs" id="nav-subs"></div>
  </nav>

  <main class="main" id="main" tabindex="-1"></main>

  <!-- persistent player: lives in the watch page slot or in the mini dock -->
  <div class="mini-dock" id="mini-dock" hidden>
    <div class="mini-info">
      <div class="mini-title" id="mini-title"></div>
      <div class="mini-actions">
        <button class="icon-btn sm" id="mini-expand" title="크게 보기"><svg><use href="#i-expand"/></svg></button>
        <button class="icon-btn sm" id="mini-close" title="닫기"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
  </div>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
</div>
